# Clarity - Sistema de gestion clinica y operativa
#
# Pensado para el build pack "Docker Compose" de Coolify: la imagen se
# construye desde el Dockerfile del repositorio y Coolify inyecta las variables
# de entorno y las etiquetas de Traefik para el dominio configurado.

x-app-environment: &app-environment
  APP_NAME: '${APP_NAME:-Clarity}'
  APP_ENV: '${APP_ENV:-production}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG:-false}'
  APP_URL: '${APP_URL}'
  APP_LOCALE: '${APP_LOCALE:-es}'
  APP_FALLBACK_LOCALE: '${APP_FALLBACK_LOCALE:-es}'
  APP_TIMEZONE: '${APP_TIMEZONE:-UTC}'

  # El servidor es MariaDB, pero la conexion se declara como mysql a proposito:
  # varias migraciones y servicios se ramifican con getDriverName() === 'mysql'
  # (el indice FULLTEXT de patients, entre otros) y MariaDB los soporta igual.
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: '3306'
  DB_DATABASE: '${DB_DATABASE:-clarity}'
  DB_USERNAME: '${DB_USERNAME:-clarity}'
  DB_PASSWORD: '${DB_PASSWORD}'

  SESSION_DRIVER: '${SESSION_DRIVER:-database}'
  SESSION_LIFETIME: '${SESSION_LIFETIME:-480}'
  SESSION_DOMAIN: '${SESSION_DOMAIN:-null}'
  SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-false}'
  SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS}'

  QUEUE_CONNECTION: '${QUEUE_CONNECTION:-database}'
  CACHE_STORE: '${CACHE_STORE:-database}'
  FILESYSTEM_DISK: '${FILESYSTEM_DISK:-local}'
  BROADCAST_CONNECTION: log

  LOG_CHANNEL: '${LOG_CHANNEL:-stack}'
  LOG_STACK: '${LOG_STACK:-single}'
  LOG_LEVEL: '${LOG_LEVEL:-warning}'

  MAINTENANCE_IMPORT_MAX_MB: '${MAINTENANCE_IMPORT_MAX_MB:-1024}'

  MAIL_MAILER: '${MAIL_MAILER:-log}'
  MAIL_SCHEME: '${MAIL_SCHEME:-null}'
  MAIL_HOST: '${MAIL_HOST:-127.0.0.1}'
  MAIL_PORT: '${MAIL_PORT:-2525}'
  MAIL_USERNAME: '${MAIL_USERNAME:-null}'
  MAIL_PASSWORD: '${MAIL_PASSWORD:-null}'
  MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:-no-reply@medio-digital.net}'
  MAIL_FROM_NAME: '${APP_NAME:-Clarity}'

  ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
  AI_FEATURES_ENABLED: '${AI_FEATURES_ENABLED:-false}'

  WHATSAPP_PROVIDER: '${WHATSAPP_PROVIDER:-}'
  TWILIO_ACCOUNT_SID: '${TWILIO_ACCOUNT_SID:-}'
  TWILIO_AUTH_TOKEN: '${TWILIO_AUTH_TOKEN:-}'
  TWILIO_WHATSAPP_FROM: '${TWILIO_WHATSAPP_FROM:-}'

services:
  # MariaDB y no MySQL 8.4: la imagen de la aplicacion solo puede traer el
  # cliente de MariaDB (Alpine no empaqueta el de MySQL), y ese cliente no
  # sabe hablar caching_sha2_password ni acepta el certificado autofirmado de
  # MySQL 8.4. Sin un mysqldump que conecte, DatabaseBackupService falla y con
  # el se cae la restauracion, que hace un respaldo previo obligatorio.
  mariadb:
    image: 'mariadb:11.4'
    restart: unless-stopped
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
    environment:
      MARIADB_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MARIADB_DATABASE: '${DB_DATABASE:-clarity}'
      MARIADB_USER: '${DB_USERNAME:-clarity}'
      MARIADB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'clarity_mariadb:/var/lib/mysql'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
    expose:
      - '8080'
    ports:
      # Acceso directo por LAN: evita el limite de 100 MB y el timeout de 100 s
      # de Cloudflare al cargar respaldos e importaciones grandes.
      - '${LAN_PORT:-8081}:8080'
    volumes:
      - 'clarity_storage:/var/www/html/storage'
    depends_on:
      mariadb:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    command:
      - 'php'
      - 'artisan'
      - 'queue:work'
      - '--sleep=3'
      - '--tries=3'
      # Las importaciones legacy pueden tardar mucho.
      - '--timeout=3600'
      - '--max-time=3600'
    volumes:
      # Compartido con app: el controlador de mantenimiento sube el archivo a
      # storage/app/private/imports y el job lo lee desde aqui.
      - 'clarity_storage:/var/www/html/storage'
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      CONTAINER_ROLE: scheduler
    command:
      - 'php'
      - 'artisan'
      - 'schedule:work'
    volumes:
      - 'clarity_storage:/var/www/html/storage'
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  clarity_mariadb:
  clarity_storage:
