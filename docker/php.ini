; Replica los limites de public/.user.ini, que solo aplica bajo Apache/PHP-FPM
; con user_ini habilitado.

memory_limit = 512M
upload_max_filesize = 1024M
post_max_size = 1024M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 50

; $_ENV debe poblarse desde el entorno: no hay archivo .env en la imagen, la
; configuracion llega por variables de entorno de Docker.
variables_order = "EGPCS"

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El codigo nunca cambia dentro de una imagen: evita los stat() por request.
opcache.validate_timestamps = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
